# Desliga o ProblemDetailsExceptionHandler do Spring MVC.
# Com ele ativo, as respostas 400 de validação (@Valid) são geradas pelo framework
# e chegam ao front-end sem o detalhe dos campos; desligado, elas passam pelo
# GlobalExceptionHandler e saem no mesmo formato ProblemDetail dos demais erros.
spring.mvc.problemdetails.enabled=false